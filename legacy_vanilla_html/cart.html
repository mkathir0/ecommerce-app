<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeShop &bull; My Cart</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">MeShop<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Signup</a></li>
      <li>
        <a href="cart.html" class="active">
          My Cart <span class="cart-badge" id="cart-badge-count">0</span>
        </a>
      </li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <!-- Cart Content Area -->
  <main class="cart-container">
    <h1 class="cart-header">My Cart</h1>

    <div class="cart-layout">
      <!-- Left: Cart Items List -->
      <section id="cart-items-container" class="cart-items-list">
        <!-- Rendered dynamically by cart.js -->
      </section>

      <!-- Right: Checkout Summary Box -->
      <aside class="cart-summary">
        <h2 class="summary-title">Checkout List</h2>
        
        <ul id="summary-items-list" style="list-style: none; margin-bottom: 1rem; max-height: 200px; overflow-y: auto;">
          <!-- Injected items list -->
        </ul>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping & Delivery</span>
          <span style="color: var(--color-green); font-weight: 600;">FREE</span>
        </div>
        <div class="summary-row total-row">
          <span>Total Amount</span>
          <span id="cart-total">$0.00</span>
        </div>

        <button 
          type="button" 
          id="btn-checkout" 
          class="btn-black btn-checkout"
        >
          Click To Checkout &rarr;
        </button>

        <p style="font-size: 0.75rem; color: #9ca3af; text-align: center; margin-top: 1rem;">
          Secured by Razorpay Test Gateway (rzp_test_PV1oQ0oMtgXOsq)
        </p>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 MeShop. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="cart.js"></script>
</body>
</html>
