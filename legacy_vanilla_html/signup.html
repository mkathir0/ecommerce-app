<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeShop &bull; Signup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">MeShop<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html" class="active">Signup</a></li>
      <li>
        <a href="cart.html">
          My Cart <span class="cart-badge" id="cart-badge-count">0</span>
        </a>
      </li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <!-- Signup Form Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Signup</h1>
        <p>Create your MeShop account to start shopping</p>
      </div>

      <!-- Alert Box for Errors / Success -->
      <div id="alert-message" class="alert-message"></div>

      <form id="signup-form">
        <!-- 1. First Name -->
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input 
            type="text" 
            id="firstName" 
            class="form-control" 
            placeholder="First Name" 
            required 
          />
        </div>

        <!-- 2. Last Name -->
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input 
            type="text" 
            id="lastName" 
            class="form-control" 
            placeholder="Last Name" 
            required 
          />
        </div>

        <!-- 3. Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="Email Address" 
            required 
          />
        </div>

        <!-- 4. Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Password" 
            required 
          />
        </div>

        <!-- 5. Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="Confirm Password" 
            required 
          />
        </div>

        <!-- 6. Signup Button -->
        <button type="submit" id="signup-btn" class="btn-black" style="width: 100%; margin-top: 0.5rem;">
          Signup
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 MeShop. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
